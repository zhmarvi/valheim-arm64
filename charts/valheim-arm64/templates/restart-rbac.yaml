{{- if .Values.restartCronJob.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "valheim.restartName" . }}
  labels:
    {{- include "valheim.restartLabels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "valheim.restartName" . }}
  labels:
    {{- include "valheim.restartLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - apps
    resources:
      - statefulsets
    resourceNames:
      - {{ include "valheim.fullname" . }}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "valheim.restartName" . }}
  labels:
    {{- include "valheim.restartLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "valheim.restartName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "valheim.restartName" . }}
{{- end }}
