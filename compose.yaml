name: valheim-arm64

services:
  valheim:
    build:
      context: .
      platforms:
        - linux/arm64
    image: valheim-arm64:local
    platform: linux/arm64
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      SERVER_NAME: ${SERVER_NAME:-Valheim ARM64}
      WORLD_NAME: ${WORLD_NAME:-Dedicated}
      SERVER_PASSWORD: ${SERVER_PASSWORD:?Set SERVER_PASSWORD in .env}
      SERVER_PORT: ${SERVER_PORT:-2456}
      SERVER_PUBLIC: ${SERVER_PUBLIC:-1}
      SERVER_CROSSPLAY: ${SERVER_CROSSPLAY:-false}
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
      SAVE_INTERVAL: ${SAVE_INTERVAL:-1800}
      BACKUPS: ${BACKUPS:-4}
      BACKUP_SHORT: ${BACKUP_SHORT:-7200}
      BACKUP_LONG: ${BACKUP_LONG:-43200}
    ports:
      - "${SERVER_PORT:-2456}-${SERVER_PORT_END:-2458}:${SERVER_PORT:-2456}-${SERVER_PORT_END:-2458}/udp"
    volumes:
      - valheim-server:/opt/valheim
      - valheim-config:/config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  valheim-server:
  valheim-config:
